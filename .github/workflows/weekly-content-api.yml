name: Weekly Content API Shadow

on:
  schedule:
    - cron: "0 13 * * 1"   # a schedule fires only if this line was last committed by a real GitHub user (2026-09-17)
  workflow_dispatch: {}

concurrency:
  group: weekly-content-api-shadow
  cancel-in-progress: false

jobs:
  generate-validate-shadow:
    name: Generate and validate shadow content
    runs-on: ubuntu-latest
    # This job can read source and mint a GitHub OIDC JWT, but has no Git write
    # permission. Only the separate post-validation publication job can push.
    permissions:
      id-token: write
      contents: read
    env:
      # All five WIF identifiers are non-secret repository variables. The
      # workflow and generator deliberately contain no identifier literals.
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ vars.ANTHROPIC_IDENTITY_TOKEN_FILE }}

    steps:
      - name: Checkout main with history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Establish run date
        id: run-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Refuse same-day canonical publish
        env:
          RUN_DATE: ${{ steps.run-date.outputs.date }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          SAME_DAY_CANONICAL="$(git log origin/main --format='%ad%x09%s' --date=short --since="${RUN_DATE}T00:00:00Z" --until="${RUN_DATE}T23:59:59Z" | awk -F '\t' -v date="$RUN_DATE" '$1 == date && $2 ~ /^chore: weekly content update/ {print; exit}')"
          if [ -n "$SAME_DAY_CANONICAL" ]; then
            echo "IDEMPOTENCY_GUARD_FAILED: same-day canonical publish exists on main: $SAME_DAY_CANONICAL" >&2
            exit 1
          fi
          echo "Same-day canonical publish guard passed for ${RUN_DATE}."

      # OIDC tokens have a short lifetime. This is intentionally adjacent to
      # generation: the script rejects a stale or near-expiry token instead of
      # attempting a silent re-fetch or retry with a dead assertion.
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = process.env.ANTHROPIC_IDENTITY_TOKEN_FILE;
            if (!path) throw new Error('Federated identity configuration is missing: ANTHROPIC_IDENTITY_TOKEN_FILE; no generation request was made');
            const token = await core.getIDToken('https://api.anthropic.com');
            fs.writeFileSync(path, token, { mode: 0o600 });

      - name: Generate, schema-validate, render, and run all gates
        env:
          VITE_ANALYTICS_ENDPOINT: ${{ secrets.VITE_ANALYTICS_ENDPOINT || 'https://analytics.silkierstrands.com' }}
          VITE_ANALYTICS_WEBSITE_ID: ${{ secrets.VITE_ANALYTICS_WEBSITE_ID || 'silkierstrands' }}
          VITE_APP_ID: silkierstrands
          VITE_APP_TITLE: SilkierStrands
          VITE_FRONTEND_FORGE_API_KEY: ${{ secrets.VITE_FRONTEND_FORGE_API_KEY || '' }}
          VITE_FRONTEND_FORGE_API_URL: ${{ secrets.VITE_FRONTEND_FORGE_API_URL || '' }}
        run: |
          set -euo pipefail
          node scripts/generate-weekly-article.mjs --date "${{ steps.run-date.outputs.date }}"

      - name: Upload generated content, rendered output, and telemetry
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-content-api-shadow-${{ steps.run-date.outputs.date }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            .ops/generated-content/**
            .ops/shadow-render/**
            .ops/content-runs/**
            client/src/lib/products.ts
            client/public/sitemap.xml
            dist/public/**
            scripts/static-bodies.json
            asin-mapping-report.json

  publish-validated-shadow:
    name: Publish validated shadow branch
    needs: generate-validate-shadow
    runs-on: ubuntu-latest
    # This job has no OIDC permission and cannot obtain an Anthropic token. It
    # only commits validated files received through the prior job artifact.
    permissions:
      contents: write

    steps:
      - name: Checkout main with history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Establish run date
        id: run-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Download validated shadow artifact
        uses: actions/download-artifact@v8
        with:
          name: weekly-content-api-shadow-${{ steps.run-date.outputs.date }}
          path: .

      - name: Push validated shadow branch
        env:
          RUN_DATE: ${{ steps.run-date.outputs.date }}
        run: |
          set -euo pipefail
          BRANCH="content-shadow/${RUN_DATE}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "SHADOW_BRANCH_EXISTS: ${BRANCH}; refusing to overwrite a prior shadow run." >&2
            exit 1
          fi
          test -s ".ops/generated-content/${RUN_DATE}.json"
          test -s ".ops/content-runs/${RUN_DATE}.json"
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- client/src/lib/products.ts client/public/sitemap.xml .ops/content-runs .ops/generated-content
          git diff --cached --quiet && { echo "NO_SHADOW_OUTPUT_TO_PUSH" >&2; exit 1; }
          git commit -m "chore: shadow weekly content ${RUN_DATE}"
          git push origin "HEAD:${BRANCH}"
          echo "Pushed validated shadow content to ${BRANCH}; main was not modified."
