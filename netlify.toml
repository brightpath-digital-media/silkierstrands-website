# SilkierStrands.com — Netlify Configuration

[build]
  # Build: enforce direct, live title-matched ASINs → generate sitemap → Vite build → static prerender
  command = "pnpm install && node scripts/validate-commerce-template.mjs && node scripts/validate-asins.mjs && if [ -n \"$CREATORS_API_CLIENT_ID\" ] && [ -n \"$CREATORS_API_CLIENT_SECRET\" ] && [ -n \"$CREATORS_API_PARTNER_TAG\" ]; then node scripts/fetch-prices.js || echo 'Creators API price sync failed; freshness gate will fail closed.'; else echo 'Creators API credentials unavailable; price UI will hide catalog values.'; fi; (node scripts/build-product-image-library.mjs || echo 'product image gap-fill incomplete; image-coverage gate decides') && pnpm exec tsx scripts/extract-site-data.ts && pnpm exec tsx scripts/render-static-bodies.tsx && node scripts/generate-sitemap.mjs && pnpm build && (node scripts/write-sync-status.mjs || true) && node scripts/prerender.mjs && node scripts/validate-image-coverage.mjs --dir dist/public && echo ${COMMIT_REF:-local} > dist/public/version.txt"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10"
  # Remote Creators API and Amazon responses are advisory; local template checks remain blocking.
  ASIN_VALIDATE = "warn"

[functions]
  node_bundler = "esbuild"

# ─── API routes → Netlify Functions ──────────────────────────────────────────
# POST /api/subscribe → subscribe.mjs (email capture + EmailOctopus segmentation)
[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200
  force = true

# Priority 2: www → non-www (301 permanent redirect)
[[redirects]]
  from = "https://www.silkierstrands.com/*"
  to = "https://silkierstrands.com/:splat"
  status = 301
  force = true

# Priority 2: http → https (belt-and-suspenders; Netlify enforces HTTPS automatically)
[[redirects]]
  from = "http://silkierstrands.com/*"
  to = "https://silkierstrands.com/:splat"
  status = 301
  force = true

# Consolidate duplicate detail routes on their descriptive canonical URLs.
[[redirects]]
from = "/review/ghd-platinum-plus-review"
to = "/review/ghd-platinum-plus-hair-straightener-review"
status = 301
force = true

[[redirects]]
from = "/comparison/moroccanoil-vs-olaplex-no7-oil"
to = "/comparison/moroccanoil-treatment-vs-olaplex-no7-bonding-oil"
status = 301
force = true

[[redirects]]
from = "/comparison/chi-air-expert-vs-verb-ghost-flat-iron"
to = "/comparison/chi-air-expert-vs-ghd-platinum-plus"
status = 301
force = true

# Unknown routes return the static 404 document. Existing prerendered route
# files and static assets win because this fallback is intentionally not forced.
[[redirects]]
from = "/*"
to = "/404.html"
status = 404

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache sitemap for 1 day
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Cache robots.txt for 1 week
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Cache PDF guides for 30 days
[[headers]]
  for = "/guides/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

